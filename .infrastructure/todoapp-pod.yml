apiVersion: v1
kind: Pod
metadata:
  name: todoapp
  namespace: todoapp
spec:
  containers:
    - name: todoapp
      image: eug696/todoapp:3.0.0
      livenessProbe:
        httpGet:
          path: /api/health
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /api/readiness
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 5